spring:
  application:
    name: triagedeck
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/triagedeck}
    username: ${DB_USERNAME:triagedeck}
    password: ${DB_PASSWORD:triagedeck}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: triagedeck-alert-ingest
      auto-offset-reset: earliest
    producer:
      retries: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/triagedeck}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/triagedeck/protocol/openid-connect/certs}
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  business-zone: Asia/Shanghai
  kafka:
    dlt-suffix: .dlt
    topics:
      ingested: alert.ingested
      cleared: alert.cleared
    consumer:
      group:
        ingest: triagedeck-alert-ingest
        notify: triagedeck-notify
  keycloak:
    admin:
      base-url: http://keycloak:8081
      realm: triagedeck
      client-id: triagedeck-audit-collector
      client-secret: ${KC_COLLECTOR_SECRET:}
  ai:
    enabled: true
    mock: false
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout: 60s
    sse-timeout: 120s
    max-concurrent-briefings: 8
  security:
    test-endpoints: false

logging:
  level:
    io.github.wangkui.triagedeck: info
    org.springframework.security: warn
