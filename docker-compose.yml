services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: triagedeck
      POSTGRES_PASSWORD: triagedeck
      POSTGRES_DB: triagedeck
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagedeck -d triagedeck"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      # 两个监听：PLAINTEXT 给容器内（app → kafka:9092），EXTERNAL 给宿主机工具（localhost:19092）
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # topic 由 kafka-init 显式创建（02-design §5.1），禁止自动建 topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      # 只暴露 EXTERNAL 监听器；宿主 9092 留给 Homebrew Kafka，两者不再抢端口
      - "19092:19092"
    healthcheck:
      # 注意：不要用 /opt/kafka/bin/kafka-broker-api-versions.sh 做健康检查。
      # 该脚本每次都会冷启动一个 JVM，本地实测单次耗时约 30s，远超 timeout，
      # 会被 docker 判为 "Health check exceeded timeout"，累计失败后容器标记 unhealthy，
      # 导致 docker compose up --wait 直接失败。这里改为轻量 TCP 探测 broker 端口。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -uo pipefail
        for attempt in $$(seq 1 30); do
          ok=1
          for topic in alert.ingested alert.cleared alert.ingested.dlt alert.cleared.dlt; do
            if ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1 >/dev/null 2>&1; then
              ok=0
            fi
          done
          if [ "$$ok" -eq 1 ]; then
            echo "topics ready:"
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
            exit 0
          fi
          echo "attempt $$attempt: broker/controller not ready, retry in 5s"
          sleep 5
        done
        echo "failed to create topics after retries" >&2
        exit 1

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/triagedeck
      DB_USERNAME: triagedeck
      DB_PASSWORD: triagedeck
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/triagedeck
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/triagedeck/protocol/openid-connect/certs
      KC_COLLECTOR_SECRET: ${KC_COLLECTOR_SECRET:-triagedeck-audit-collector-secret}
      KC_ADMIN_BASE_URL: ${KC_ADMIN_BASE_URL:-http://keycloak:8080}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
